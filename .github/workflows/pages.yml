name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
      - feature/archive-center-v2-preview
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-combined-site
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout stable main site
        uses: actions/checkout@v4
        with:
          ref: main
          path: site

      - name: Checkout current branch as preview source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          path: preview-source

      - name: Assemble stable root and branch preview
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/previews/archive-center-v2
          mkdir -p site/previews/archive-center-v2
          rsync -a \
            --exclude '.git/' \
            --exclude '.github/' \
            preview-source/ site/previews/archive-center-v2/
          printf '%s\n' "${GITHUB_REF_NAME}" > site/previews/archive-center-v2/PREVIEW_BRANCH.txt

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages site
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
