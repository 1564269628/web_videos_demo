<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#050505">
  <meta name="color-scheme" content="dark">
  <meta name="referrer" content="no-referrer">
  <title>沉浸式短视频</title>
  <link rel="stylesheet" href="./douyin.css?v=20260804-1">
</head>
<body>
  <div class="short-app">
    <aside class="desktop-rail" aria-label="主导航">
      <a class="brand" href="./douyin.html" aria-label="沉浸式短视频首页">
        <span class="brand-mark">▶</span>
        <span>短视频</span>
      </a>
      <nav class="rail-nav">
        <button type="button" class="rail-item active" data-nav="recommend">
          <span>⌂</span><strong>推荐</strong>
        </button>
        <button type="button" class="rail-item" data-nav="latest">
          <span>◷</span><strong>最新</strong>
        </button>
        <button type="button" class="rail-item" data-nav="liked">
          <span>♥</span><strong>喜欢</strong>
        </button>
      </nav>
      <div class="rail-bottom">
        <a href="./index.html" class="rail-item rail-link"><span>▦</span><strong>归档中心</strong></a>
      </div>
    </aside>

    <main class="feed-shell">
      <header class="feed-header">
        <div class="feed-tabs" role="tablist" aria-label="视频流">
          <button type="button" class="feed-tab active" data-feed-tab="recommend">推荐</button>
          <button type="button" class="feed-tab" data-feed-tab="latest">最新</button>
        </div>
        <div class="header-actions">
          <label class="category-control" for="category-select">
            <span>分类</span>
            <select id="category-select">
              <option value="">全部</option>
            </select>
          </label>
          <button id="refresh-button" type="button" class="icon-button" aria-label="刷新">↻</button>
          <span id="connection-status" class="connection-status busy">正在连接</span>
        </div>
      </header>

      <section id="feed" class="video-feed" aria-label="短视频列表">
        <div id="feed-empty" class="feed-empty">
          <div class="loading-ring" aria-hidden="true"></div>
          <strong>正在连接视频服务器</strong>
          <span id="feed-empty-detail">测速、游客登录并加载视频中…</span>
        </div>
      </section>

      <div class="feed-nav" aria-label="视频切换">
        <button id="previous-video" type="button" aria-label="上一个视频">↑</button>
        <button id="next-video" type="button" aria-label="下一个视频">↓</button>
      </div>
    </main>

    <nav class="mobile-nav" aria-label="移动端导航">
      <button type="button" class="active" data-mobile-nav="recommend"><span>⌂</span>首页</button>
      <button type="button" data-mobile-nav="latest"><span>◷</span>最新</button>
      <a href="./index.html"><span>▦</span>归档</a>
      <button type="button" data-mobile-nav="profile"><span>◎</span>我的</button>
    </nav>
  </div>

  <div id="author-modal" class="author-modal" hidden>
    <button type="button" class="author-backdrop" data-close-author aria-label="关闭作者主页"></button>
    <section class="author-sheet" role="dialog" aria-modal="true" aria-labelledby="author-name">
      <header class="author-sheet-top">
        <button type="button" class="sheet-close" data-close-author aria-label="关闭">×</button>
        <span>作者主页</span>
        <button id="author-refresh" type="button" class="sheet-action">刷新</button>
      </header>

      <div class="author-profile">
        <img id="author-avatar" class="author-avatar" alt="作者头像">
        <div class="author-identity">
          <h2 id="author-name">加载中…</h2>
          <p id="author-uid">UID —</p>
          <p id="author-intro">正在获取作者资料…</p>
        </div>
      </div>

      <div id="author-stats" class="author-stats"></div>

      <div class="author-work-heading">
        <div>
          <h3>作品</h3>
          <span id="author-work-status">加载中…</span>
        </div>
        <button id="author-more" type="button" class="sheet-action">加载更多</button>
      </div>

      <div id="author-works" class="author-works"></div>
    </section>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <span id="active-api" hidden></span>
  <span id="active-resource" hidden></span>

  <script src="https://cdn.jsdelivr.net/npm/crypto-js@4.2.0/crypto-js.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.13/dist/hls.min.js" crossorigin="anonymous"></script>
  <script src="./config.js?v=20260803-35"></script>
  <script src="./douyin.js?v=20260804-1"></script>
</body>
</html>
